services:
  postgres:
    cpus: "0.75"
    mem_limit: 512m
    memswap_limit: 768m
    command:
      - postgres
      - -c
      - max_connections=20
      - -c
      - shared_buffers=64MB
      - -c
      - work_mem=2MB
      - -c
      - maintenance_work_mem=16MB
      - -c
      - max_parallel_workers=0

  api:
    cpus: "0.50"
    mem_limit: 384m
    memswap_limit: 512m
    environment:
      NODE_OPTIONS: --max-old-space-size=256
