name: decolumax-sync

services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    cpus: "1.0"
    mem_limit: 1g
    pids_limit: 256
    command:
      - postgres
      - -c
      - max_connections=32
      - -c
      - shared_buffers=128MB
      - -c
      - work_mem=2MB
      - -c
      - maintenance_work_mem=32MB
      - -c
      - max_parallel_workers=0
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - decolumax_pgdata:/var/lib/postgresql/data
    networks:
      - internal
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s

  api:
    image: ${SYNC_API_IMAGE:-decolumax-sync-api:0.1.0}
    build:
      context: ../../..
      dockerfile: server/layer/deploy/Dockerfile
    restart: unless-stopped
    cpus: "0.75"
    mem_limit: 512m
    pids_limit: 128
    environment:
      NODE_ENV: production
      PORT: 3000
      API_PREFIX: api/v1
      CORS_ORIGINS: ${CORS_ORIGINS:?Set CORS_ORIGINS to the Flutter web origin}
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET}
      JWT_ACCESS_TTL_SECONDS: ${JWT_ACCESS_TTL_SECONDS:-900}
      REFRESH_TOKEN_DAYS: ${REFRESH_TOKEN_DAYS:-30}
      RUN_MIGRATIONS: ${RUN_MIGRATIONS:-true}
      DATABASE_POOL_MAX: ${DATABASE_POOL_MAX:-4}
      DATABASE_POOL_IDLE_TIMEOUT_MS: ${DATABASE_POOL_IDLE_TIMEOUT_MS:-10000}
      DATABASE_POOL_CONNECTION_TIMEOUT_MS: ${DATABASE_POOL_CONNECTION_TIMEOUT_MS:-2000}
      NATS_URL: ${NATS_URL:-tls://mant.qpsecure.cloud:4422}
      NATS_SYNC_USER: ${NATS_SYNC_USER:?Set NATS_SYNC_USER in .env}
      NATS_SYNC_PASSWORD: ${NATS_SYNC_PASSWORD:?Set NATS_SYNC_PASSWORD in .env}
      NATS_SYNC_STREAM: ${NATS_SYNC_STREAM:-DECO_SYNC}
    expose:
      - "3000"
    networks:
      internal: {}
      npm_proxy:
        aliases:
          - decolumax-sync-api
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test:
        ["CMD-SHELL", "node -e \"fetch('http://127.0.0.1:3000/api/v1/health/ready').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))\""]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

volumes:
  decolumax_pgdata:

networks:
  internal:
    internal: true
  npm_proxy:
    external: true
    name: ${NPM_DOCKER_NETWORK:-main_npm_network}
