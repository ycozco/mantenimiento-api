server_name: decolumax-sync-smoke
port: 4222
http: 8222
max_payload: 1MB
max_connections: 32

authorization {
  users: [
    {
      user: $NATS_SMOKE_USER
      password: $NATS_SMOKE_PASSWORD
    }
  ]
}

tls {
  cert_file: "/etc/nats/certs/server-cert.pem"
  key_file: "/etc/nats/certs/server-key.pem"
  timeout: 2
}

jetstream {
  store_dir: "/data/jetstream"
  max_mem: 64MB
  max_file: 900MB
  sync_interval: "always"
}
